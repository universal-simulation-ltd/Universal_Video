# The Playwright specs in `e2e/*.e2e.ts`, on every push and pull request:
# `npx playwright test` starts the Vite dev server on :5199 itself (see
# playwright.config.ts) and puts a real MP4 through the app. Chromium for
# everything, WebKit (the iPhone engine) for the timeline strips. On Linux,
# which is what this runs on, the WebKit project and two Chromium specs that
# need an AAC decoder are left out: see LINUX_SKIP_* at the top of
# playwright.config.ts, which says why for each.
#
# @playwright/test is a devDependency, locked at the version below.
#
# The jobs run in Playwright's own image for the version below, which already
# holds the browsers AND their system libraries: installing the libraries with
# `playwright install-deps` on a bare runner took 9 to 38 minutes of apt per
# job (Universal PDF, measured 2026-10-22), where pulling the image takes about
# one. The image is the browser cache. Keep its tag and PLAYWRIGHT_VERSION the
# same as each other, and as the Playwright version npm installs.
#
# Free: the repo is public, so ubuntu-latest minutes cost nothing.

name: e2e

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A newer push to a branch or PR cancels the older run, but not on main: main
# moves often (several sessions push to it), and every commit there should
# get its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  PLAYWRIGHT_VERSION: '1.62.1'

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      # --ipc=host: Chromium runs out of shared memory in a container
      # without it. --user 1001: the runner's own user (Playwright's advice),
      # so the checkout is writable and Firefox is not started as root.
      options: --ipc=host --user 1001
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Playwright specs
        run: npx playwright test

      - name: Keep the traces of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 14
