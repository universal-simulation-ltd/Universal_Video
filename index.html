    <!-- ⚠️ The H1 used to be "Compress a video without uploading it", verbatim,
         because that phrase is plausibly the highest-volume intent in the suite
         and /converter will never rank for it (§10, Q1 of
         Docs_UNI_SIM/next-products.md). **The owner moved it off the front line
         on 2026-08-13**: this is an editor now — clipping, cutting and changing
         the frame is what it is FOR, and compressing is one thing it can do on
         the way out. So the phrase is demoted, not deleted: it is still in the
         description and the keywords, where it can still be matched, and it is
         no longer the first thing a visitor is told the app is. Keep it
         somewhere on this page; don't put it back at the top. -->
    <title>Clip, cut and resize a video without uploading it — Universal Video</title>
    <meta name="description" content="Clip, cut and resize a video without uploading it. Universal Video trims, cuts and reframes MP4, M4V and MOV on a real timeline inside your browser — and it will compress a video without uploading it too. Nothing is sent to a server: no account, no file-size cap, no watermark and no queue. Free and open source." />
    <meta name="keywords" content="clip a video online, cut a video in browser, trim video without uploading, resize video, change video dimensions, 1080x1920 video, video editor in browser, compress video without uploading, reduce video file size, mov to mp4, private video editor, offline video editor, open source" />
    <meta name="author" content="UNI·SIM" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="canonical" href="https://opensource.unisim.co.uk/video/" />

    <!-- Structured data. The credit James asked for on 2026-09-05 lives in two
         places, and this is the one a search engine can read: the in-app line
         is in the SDK's <AboutAppDialog>, which is a React portal and only
         enters the DOM once somebody opens it, so a crawler never sees it.

         Every value below is taken from THIS FILE's own <title>, description
         and canonical rather than typed again, so the block cannot drift from
         what the page already says about itself. The author matches the app's
         marketing page on unisim.co.uk and points at the same /about-james,
         so both resolve to one person rather than two mentions of a name. -->
